<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТЕЛЕМЕТРИЯ // ОБЪЕКТ 3826</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #050505; color: #f4e8d3; font-family: 'JetBrains Mono', monospace; margin: 0; padding: 20px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #5a5a5f; padding-bottom: 15px; margin-bottom: 20px; }
        h1 { margin: 0; color: #cc0000; font-size: 20px; text-transform: uppercase; letter-spacing: 3px; }
        .controls-panel { background: #141417; border: 1px solid #333; padding: 15px; margin-bottom: 20px; display: flex; gap: 20px; flex-wrap: wrap; }
        select, button { background: #000; color: #fff; border: 1px solid #5a5a5f; padding: 8px 15px; font-family: inherit; font-size: 12px; cursor: pointer; }
        select:focus, button:hover { border-color: #cc0000; }
        button.danger { background: #330000; color: #ff4444; border-color: #ff4444; }
        .users-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 15px; max-height: 150px; overflow-y: auto; padding: 10px; background: #000; border: 1px inset #333; }
        .user-cb { display: flex; align-items: center; gap: 8px; font-size: 11px; text-transform: uppercase; }
        .chart-wrapper { background: #0a0a0c; border: 2px solid #333; padding: 20px; height: 60vh; position: relative; }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="/tg/" style="background: #cc0000; color: #fff; padding: 8px 12px; text-decoration: none; font-size: 12px; font-weight: bold;">[ НАЗАД ]</a>
        <h1>ТЕЛЕМЕТРИЯ АКТИВНОСТИ</h1>
    </div>

    <div class="controls-panel">
        <div>
            <span style="display:block; margin-bottom:5px; color:#aaa; font-size:10px;">МАСШТАБ ВРЕМЕНИ:</span>
            <select id="time_res">
                <option value="minute">ПО МИНУТАМ</option>
                <option value="hour" selected>ПО ЧАСАМ</option>
                <option value="day">ПО ДНЯМ</option>
                <option value="week">ПО НЕДЕЛЯМ</option>
                <option value="month">ПО МЕСЯЦАМ</option>
                <option value="year">ПО ГОДАМ</option>
            </select>
        </div>
        <div style="flex-grow: 1;">
            <span style="display:block; margin-bottom:5px; color:#aaa; font-size:10px;">ФИЛЬТР ОБЪЕКТОВ:</span>
            <button id="btn_all">ВЫБРАТЬ ВСЕХ</button>
            <button id="btn_none" class="danger">ОЧИСТИТЬ</button>
            <div class="users-grid" id="users_container"></div>
        </div>
    </div>

    <div class="chart-wrapper">
        <canvas id="mainChart"></canvas>
    </div>

    <script src="app.js"></script>
</body>
</html>
